<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnerFlow v0.1</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>EnerFlow v0.1</h1>
      <p>Place tasks in the energy windows where you are most likely to complete them.</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="plan">Plan</button>
      <button class="tab" data-tab="now">Now</button>
      <button class="tab" data-tab="review">Review</button>
    </nav>

    <main>
      <section id="plan" class="panel active">
        <h2>Morning Plan (1 min)</h2>
        <form id="taskForm" class="card">
          <input id="title" placeholder="Task title" required />
          <div class="row">
            <input id="estimatedMinutes" type="number" min="5" step="5" placeholder="Estimated minutes (optional)" />
            <select id="energyDemand">
              <option value="3">Energy Demand 3</option>
              <option value="1">Energy Demand 1</option>
              <option value="2">Energy Demand 2</option>
              <option value="4">Energy Demand 4</option>
              <option value="5">Energy Demand 5</option>
            </select>
            <select id="focusType">
              <option value="deep">deep</option>
              <option value="shallow">shallow</option>
              <option value="social">social</option>
            </select>
            <select id="importance">
              <option value="normal">normal</option>
              <option value="mit">MIT</option>
            </select>
          </div>
          <button type="submit">Add Task</button>
        </form>

        <div class="card">
          <h3>Energy Check-ins (morning / noon / evening)</h3>
          <div id="checkinHint" style="margin-bottom:8px;color:#93c5fd"></div>
          <div id="checkinContainer"></div>
        </div>

        <div class="card">
          <h3>Auto Scheduling</h3>
          <div class="row">
            <select id="strategy">
              <option value="steady">steady</option>
              <option value="sprint">sprint</option>
              <option value="conservative">conservative</option>
            </select>
            <button id="btnLoadCalendar">Load Google Calendar Meeting Density</button>
            <button id="btnGenerate">Generate Schedule</button>
            <button id="btnApply">Apply Schedule</button>
          </div>
          <div id="meetingDensity" style="margin-top:8px;color:#93c5fd"></div>
          <div id="windows" class="windows"></div>
          <div id="recommendations"></div>
        </div>

        <div class="card">
          <h3>Task List</h3>
          <div id="taskList"></div>
        </div>
      </section>

      <section id="now" class="panel">
        <h2>Execution (Now)</h2>
        <div class="card">
          <div id="runningInfo">No running task right now</div>
          <div class="row">
            <select id="startTaskSelect"></select>
            <button id="btnStart">Start Task</button>
          </div>
          <div class="row">
            <select id="energyCost">
              <option value="3">Actual Energy Cost 3</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <input id="reasonTags" placeholder="Reason tags (comma-separated), e.g. distraction,sleep_low" />
            <button id="btnEnd">End Task</button>
          </div>
        </div>

        <div class="card">
          <h3>Today's Sessions</h3>
          <div id="sessionList"></div>
        </div>
      </section>

      <section id="review" class="panel">
        <h2>Night Review (1 min)</h2>
        <div class="card" id="reviewCard"></div>
        <div class="card">
          <h3>Weekly Trends (7 days)</h3>
          <div id="weeklyTrends"></div>
        </div>
        <button id="btnRefreshReview">Refresh Review</button>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
